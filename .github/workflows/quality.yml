name: Quality

# Every push to main: typecheck, lint, unit tests with coverage, secret scan,
# dependency audit, then a SonarQube Cloud analysis whose results the README's
# badges show. The analysis is skipped until the SONAR_TOKEN secret exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/food-couriers
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # SonarQube Cloud reads the history for blame and for what counts as new code
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: apps/food-couriers/.nvmrc
          cache: npm
          cache-dependency-path: apps/food-couriers/package-lock.json
      # no dependency needs its install scripts for these checks, so none run
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        # writes coverage/lcov.info, which sonar-project.properties points at
        run: npm run test:coverage

      - name: Secret scan
        run: npm run check:secrets

      - name: Dependency audit
        # advisory: the findings are in the Expo, Metro and Tailwind toolchain,
        # and fixing them waits on upstream releases
        continue-on-error: true
        run: npm run audit

      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: apps/food-couriers
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'symplr-io' }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'Symplr-io_food-couriers-demo' }}
